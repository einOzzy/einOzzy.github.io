<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Lucent - Roster Admin Tool</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0f1c29;
            --bg-secondary: #16293c;
            --bg-card: #1c334d;
            --accent: #7DD3FC;
            --text-main: #ffffff;
            --text-muted: #8da3b8;
            --danger: #ef4444;
            --success: #22c55e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); padding: 20px; min-height: 100vh; }

        .container { max-width: 1000px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; background: var(--bg-secondary); padding: 20px; border-radius: 12px; border: 1px solid rgba(125, 211, 252, 0.1); }
        h1 { color: var(--accent); font-size: 24px; text-transform: uppercase; letter-spacing: 1px; }

        .config-card { background: var(--bg-secondary); padding: 20px; border-radius: 12px; margin-bottom: 25px; border: 1px solid rgba(125, 211, 252, 0.1); }
        .config-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }
        
        label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px 14px; background: var(--bg-primary); border: 1px solid rgba(141, 163, 184, 0.3); border-radius: 8px; color: white; font-size: 14px; }
        input:focus, select:focus { outline: none; border-color: var(--accent); }

        .btn { background: var(--accent); color: var(--bg-primary); font-weight: 600; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; font-size: 14px; }
        .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-secondary { background: var(--bg-card); color: var(--text-main); border: 1px solid rgba(141, 163, 184, 0.3); }

        .actions-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        .player-list { display: grid; gap: 15px; }
        .player-row { background: var(--bg-secondary); padding: 15px 20px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; border: 1px solid rgba(141, 163, 184, 0.15); transition: 0.2s; }
        .player-row:hover { border-color: var(--accent); }
        .player-meta { display: flex; align-items: center; gap: 15px; }
        .player-thumb { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; background: var(--bg-primary); }
        .player-name { font-weight: 600; font-size: 16px; }
        .player-role { font-size: 13px; color: var(--text-muted); }
        .player-actions { display: flex; gap: 10px; }

        /* Modal styling */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 100; padding: 20px; overflow-y: auto; }
        .modal-content { background: var(--bg-secondary); width: 100%; max-width: 600px; padding: 30px; border-radius: 14px; border: 1px solid rgba(125, 211, 252, 0.2); max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        
        .social-row { display: flex; gap: 10px; margin-bottom: 8px; align-items: center; }
        
        .toast { position: fixed; bottom: 20px; right: 20px; background: var(--bg-card); border-left: 4px solid var(--accent); padding: 15px 20px; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); display: none; z-index: 1000; font-size: 14px; }
        .loading-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 28, 41, 0.85); z-index: 200; align-items: center; justify-content: center; flex-direction: column; gap: 15px; color: var(--accent); font-size: 18px; }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(125, 211, 252, 0.2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <span id="loadingText">Connecting to GitHub...</span>
    </div>

    <div class="toast" id="toast">Changes saved successfully!</div>

    <div class="container">
        <header>
            <h1><i class="fa-solid fa-users-gear"></i> Team Lucent Roster Manager</h1>
            <button class="btn btn-success" onclick="publishToGitHub()"><i class="fa-solid fa-cloud-arrow-up"></i> Publish to GitHub</button>
        </header>

        <div class="config-card">
            <h3><i class="fa-solid fa-key"></i> GitHub Repository Settings</h3>
            <div class="config-grid">
                <div>
                    <label>GitHub Owner / Username</label>
                    <input type="text" id="ghOwner" value="einOzzy">
                </div>
                <div>
                    <label>Repository Name</label>
                    <input type="text" id="ghRepo" value="team-lucent-data">
                </div>
                <div>
                    <label>Branch</label>
                    <input type="text" id="ghBranch" value="main">
                </div>
                <div>
                    <label>GitHub Personal Access Token (PAT)</label>
                    <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx">
                </div>
            </div>
            <div style="margin-top: 15px; display: flex; gap: 10px;">
                <button class="btn btn-secondary" onclick="loadRosterFromGitHub()"><i class="fa-solid fa-rotate"></i> Load Roster from GitHub</button>
            </div>
        </div>

        <div class="actions-bar">
            <h2>Roster Members (<span id="playerCount">0</span>)</h2>
            <button class="btn" onclick="openEditor()"><i class="fa-solid fa-user-plus"></i> Add New Member</button>
        </div>

        <div class="player-list" id="playerList">
            <!-- Dynamically populated roster list -->
        </div>
    </div>

    <!-- Edit/Add Modal -->
    <div class="modal" id="playerModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Add / Edit Member</h3>
                <button class="btn btn-secondary" onclick="closeEditor()" style="padding: 5px 10px;"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <input type="hidden" id="editIndex">
            
            <div class="form-group">
                <label>Name (e.g. Lucent Ozzy)</label>
                <input type="text" id="inputName">
            </div>
            
            <div class="form-group">
                <label>Role / Title (e.g. Lead Developer)</label>
                <input type="text" id="inputRole">
            </div>

            <div class="form-group">
                <label>Category</label>
                <select id="inputCategory">
                    <option value="owner">Owner</option>
                    <option value="management">Management / Staff</option>
                    <option value="players">Player / Academy</option>
                    <option value="content">Content Creator</option>
                    <option value="creatives">Creative / Designer</option>
                </select>
            </div>

            <div class="form-group">
                <label>Country Code (2 letters, e.g. DE, US, FR - leave blank if none)</label>
                <input type="text" id="inputCountry" maxlength="2" style="text-transform: uppercase;">
            </div>

            <div class="form-group">
                <label>Profile Picture (Upload new image file or keep existing URL)</label>
                <input type="file" id="inputFile" accept="image/*" style="margin-bottom: 8px;">
                <input type="text" id="inputImagePath" placeholder="https://raw.githubusercontent.com/.../image.png">
            </div>

            <div class="form-group">
                <label>Social Links</label>
                <div id="socialsContainer"></div>
                <button class="btn btn-secondary" onclick="addSocialRow()" style="margin-top: 8px; font-size: 12px; padding: 6px 12px;"><i class="fa-solid fa-plus"></i> Add Social Link</button>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                <button class="btn btn-secondary" onclick="closeEditor()">Cancel</button>
                <button class="btn btn-success" onclick="savePlayer()">Save Member</button>
            </div>
        </div>
    </div>

    <script>
        let rosterData = { team: "Team Lucent", roster: [] };
        let fileSha = ""; // Required by GitHub API for updates

        // Load saved settings from localStorage
        window.addEventListener('DOMContentLoaded', () => {
            if(localStorage.getItem('ghOwner')) document.getElementById('ghOwner').value = localStorage.getItem('ghOwner');
            if(localStorage.getItem('ghRepo')) document.getElementById('ghRepo').value = localStorage.getItem('ghRepo');
            if(localStorage.getItem('ghBranch')) document.getElementById('ghBranch').value = localStorage.getItem('ghBranch');
            if(localStorage.getItem('ghToken')) document.getElementById('ghToken').value = localStorage.getItem('ghToken');
            
            // Auto load on start if token exists
            if(document.getElementById('ghToken').value) {
                loadRosterFromGitHub();
            }
        });

        function saveSettingsToLocalStorage() {
            localStorage.setItem('ghOwner', document.getElementById('ghOwner').value);
            localStorage.setItem('ghRepo', document.getElementById('ghRepo').value);
            localStorage.setItem('ghBranch', document.getElementById('ghBranch').value);
            localStorage.setItem('ghToken', document.getElementById('ghToken').value);
        }

        function showLoading(text) {
            document.getElementById('loadingText').textContent = text;
            document.getElementById('loadingOverlay').style.display = 'flex';
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 3000);
        }

        async function loadRosterFromGitHub() {
            saveSettingsToLocalStorage();
            const owner = document.getElementById('ghOwner').value;
            const repo = document.getElementById('ghRepo').value;
            const branch = document.getElementById('ghBranch').value;
            const token = document.getElementById('ghToken').value;

            showLoading("Fetching roster.json from GitHub...");

            try {
                const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/roster.json?ref=${branch}`, {
                    headers: token ? { "Authorization": `token ${token}` } : {}
                });

                if(!response.ok) throw new Error("Failed to fetch repository data. Check your credentials and repo name.");

                const data = await response.json();
                fileSha = data.sha;
                
                // Decode base64 content from GitHub API
                const jsonString = decodeURIComponent(escape(atob(data.content)));
                rosterData = JSON.parse(jsonString);

                renderPlayerList();
                showToast("Roster loaded successfully!");
            } catch (error) {
                alert("Error: " + error.message);
            } finally {
                hideLoading();
            }
        }

        function renderPlayerList() {
            const listEl = document.getElementById('playerList');
            listEl.innerHTML = '';
            document.getElementById('playerCount').textContent = rosterData.roster.length;

            rosterData.roster.forEach((player, index) => {
                const row = document.createElement('div');
                row.className = 'player-row';
                row.innerHTML = `
                    <div class="player-meta">
                        <img src="${player.imagePath || 'https://via.placeholder.com/45'}" class="player-thumb" alt="">
                        <div>
                            <div class="player-name">${player.name}</div>
                            <div class="player-role">${player.role} &bull; <span style="color: var(--accent); text-transform: uppercase;">${player.category}</span></div>
                        </div>
                    </div>
                    <div class="player-actions">
                        <button class="btn btn-secondary" onclick="openEditor(${index})"><i class="fa-solid fa-pen"></i></button>
                        <button class="btn btn-danger" onclick="deletePlayer(${index})"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
                listEl.appendChild(row);
            });
        }

        function openEditor(index = null) {
            document.getElementById('playerModal').style.display = 'flex';
            document.getElementById('socialsContainer').innerHTML = '';
            document.getElementById('inputFile').value = '';

            if (index !== null) {
                document.getElementById('modalTitle').textContent = "Edit Member";
                document.getElementById('editIndex').value = index;
                const p = rosterData.roster[index];
                document.getElementById('inputName').value = p.name || '';
                document.getElementById('inputRole').value = p.role || '';
                document.getElementById('inputCategory').value = p.category || 'players';
                document.getElementById('inputCountry').value = p.countryCode || '';
                document.getElementById('inputImagePath').value = p.imagePath || '';

                if (p.socials) {
                    p.socials.forEach(s => addSocialRow(s.platform, s.url));
                }
            } else {
                document.getElementById('modalTitle').textContent = "Add New Member";
                document.getElementById('editIndex').value = '';
                document.getElementById('inputName').value = '';
                document.getElementById('inputRole').value = '';
                document.getElementById('inputCategory').value = 'players';
                document.getElementById('inputCountry').value = '';
                document.getElementById('inputImagePath').value = '';
                addSocialRow();
            }
        }

        function closeEditor() {
            document.getElementById('playerModal').style.display = 'none';
        }

        function addSocialRow(platform = 'Twitter', url = '') {
            const container = document.getElementById('socialsContainer');
            const row = document.createElement('div');
            row.className = 'social-row';
            row.innerHTML = `
                <select style="width: 130px;" class="social-platform">
                    <option value="Twitter" ${platform==='Twitter'?'selected':''}>Twitter / X</option>
                    <option value="TikTok" ${platform==='TikTok'?'selected':''}>TikTok</option>
                    <option value="YouTube" ${platform==='YouTube'?'selected':''}>YouTube</option>
                    <option value="Twitch" ${platform==='Twitch'?'selected':''}>Twitch</option>
                    <option value="Discord" ${platform==='Discord'?'selected':''}>Discord</option>
                    <option value="Instagram" ${platform==='Instagram'?'selected':''}>Instagram</option>
                    <option value="Behance" ${platform==='Behance'?'selected':''}>Behance</option>
                </select>
                <input type="text" placeholder="https://..." class="social-url" value="${url}" style="flex:1;">
                <button class="btn btn-danger" onclick="this.parentElement.remove()" style="padding: 8px 12px;"><i class="fa-solid fa-trash"></i></button>
            `;
            container.appendChild(row);
        }

        async function savePlayer() {
            const index = document.getElementById('editIndex').value;
            const name = document.getElementById('inputName').value.trim();
            if(!name) { alert("Name is required"); return; }

            const fileInput = document.getElementById('inputFile');
            let imagePath = document.getElementById('inputImagePath').value.trim();

            // If a new image file was uploaded, commit it to GitHub immediately
            if (fileInput.files.length > 0) {
                showLoading("Uploading profile image to GitHub...");
                try {
                    imagePath = await uploadImageFile(fileInput.files[0], name);
                } catch (e) {
                    alert("Image upload failed: " + e.message);
                    hideLoading();
                    return;
                }
            }

            // Gather social links
            const socials = [];
            document.querySelectorAll('.social-row').forEach(row => {
                const platform = row.querySelector('.social-platform').value;
                const url = row.querySelector('.social-url').value.trim();
                if(url) socials.push({ platform, url });
            });

            const playerData = {
                name: name,
                role: document.getElementById('inputRole').value.trim(),
                category: document.getElementById('inputCategory').value,
                imagePath: imagePath,
                countryCode: document.getElementById('inputCountry').value.trim().toUpperCase(),
                socials: socials
            };

            if (index === '') {
                rosterData.roster.push(playerData);
            } else {
                rosterData.roster[index] = playerData;
            }

            renderPlayerList();
            closeEditor();
            hideLoading();
            showToast("Player updated locally. Don't forget to Publish!");
        }

        async function uploadImageFile(file, playerName) {
            const owner = document.getElementById('ghOwner').value;
            const repo = document.getElementById('ghRepo').value;
            const branch = document.getElementById('ghBranch').value;
            const token = document.getElementById('ghToken').value;

            const base64Content = await toBase64(file);
            const cleanName = playerName.toLowerCase().replace(/[^a-z0-9]/g, '_');
            const fileExtension = file.name.split('.').pop();
            const filePath = `images/${cleanName}.${fileExtension}`;

            // Check if file already exists to grab its sha if needed
            let existingSha = null;
            try {
                const checkRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${filePath}?ref=${branch}`, {
                    headers: { "Authorization": `token ${token}` }
                });
                if(checkRes.ok) {
                    const checkData = await checkRes.json();
                    existingSha = checkData.sha;
                }
            } catch(e) {}

            const bodyData = {
                message: `Upload profile image for ${playerName}`,
                content: base64Content.split(',')[1],
                branch: branch
            };
            if(existingSha) bodyData.sha = existingSha;

            const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${filePath}`, {
                method: 'PUT',
                headers: {
                    "Authorization": `token ${token}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(bodyData)
            });

            if(!res.ok) throw new Error("Failed to upload image to GitHub.");
            
            // Return raw github URL
            return `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${filePath}`;
        }

        const toBase64 = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });

        function deletePlayer(index) {
            if(confirm(`Are you sure you want to remove ${rosterData.roster[index].name}?`)) {
                rosterData.roster.splice(index, 1);
                renderPlayerList();
                showToast("Player removed locally. Publish to confirm.");
            }
        }

        async function publishToGitHub() {
            saveSettingsToLocalStorage();
            const owner = document.getElementById('ghOwner').value;
            const repo = document.getElementById('ghRepo').value;
            const branch = document.getElementById('ghBranch').value;
            const token = document.getElementById('ghToken').value;

            if(!token) {
                alert("Please enter your GitHub Personal Access Token (PAT) first.");
                return;
            }

            showLoading("Publishing roster.json to GitHub...");

            try {
                // Fetch latest file SHA to prevent conflicts
                const getRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/roster.json?ref=${branch}`, {
                    headers: { "Authorization": `token ${token}` }
                });
                if(getRes.ok) {
                    const getData = await getRes.json();
                    fileSha = getData.sha;
                }

                const jsonString = JSON.stringify(rosterData, null, 2);
                const base64Content = btoa(unescape(encodeURIComponent(jsonString)));

                const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/roster.json`, {
                    method: 'PUT',
                    headers: {
                        "Authorization": `token ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        message: "Update roster via Admin Tool",
                        content: base64Content,
                        sha: fileSha,
                        branch: branch
                    })
                });

                if(!response.ok) {
                    const err = await response.json();
                    throw new Error(err.message || "Failed to commit changes.");
                }

                const resData = await response.json();
                fileSha = resData.content.sha;
                showToast("Successfully published roster to GitHub!");
            } catch (error) {
                alert("Publish failed: " + error.message);
            } finally {
                hideLoading();
            }
        }
    </script>
</body>
</html>
